name: io-hotspot
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas>=2.0
  - geopandas>=0.14
  - rasterio>=1.3
  - numpy>=1.25
  - scipy>=1.11
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - plotly>=5.18
  - cartopy>=0.22
  - pyproj>=3.6
  - shapely>=2.0
  - fiona>=1.9
  - jupyter
  - jupyterlab
  - ipykernel
  - pytest
  - pip
  - pip:
      - streamlit>=1.53
      - folium>=0.15
      - streamlit-folium>=0.15
      - pyarrow>=13.0  # for parquet support
